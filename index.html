<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 OSRS 12 Bosses of Christmas Bingo</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --card-hover: #334155;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --accent-gold: #eab308;
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #475569;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    width: 100%;
    max-width: 1200px;
  }

  h1 {
    margin: 0 0 5px 0;
    font-size: 1.8rem;
    color: #f1f5f9;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 15px;
  }

  .team-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .team-bar input {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 1rem;
    outline: none;
  }

  .team-bar button {
    background: var(--accent-green);
    color: #0f172a;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .team-bar button:hover {
    opacity: 0.9;
  }

  .status-pill {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(234, 179, 8, 0.15);
    color: var(--accent-gold);
    border: 1px solid rgba(234, 179, 8, 0.4);
  }

  .status-pill.live {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border-color: rgba(34, 197, 94, 0.4);
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 20px;
    background: var(--card-bg);
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 1.05rem;
    font-weight: 600;
    flex-wrap: wrap;
  }

  .scoreboard span {
    color: var(--accent-gold);
  }

  .leaderboard-box {
    width: 100%;
    max-width: 1200px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 20px;
  }

  .leaderboard-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .leaderboard-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .lb-chip {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .lb-chip:hover {
    border-color: var(--accent-gold);
  }

  .lb-chip strong {
    color: var(--accent-gold);
    margin-left: 6px;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 1200px;
    margin-bottom: 40px;
  }

  @media (max-width: 900px) {
    .board-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px) {
    .board-grid {
      grid-template-columns: 1fr;
    }
  }

  .boss-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    position: relative;
    transition: all 0.3s ease;
  }

  .boss-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
  }

  .boss-title {
    font-size: 1rem;
    font-weight: 700;
    color: #f1f5f9;
  }

  .boss-points-badge {
    background: rgba(234, 179, 8, 0.15);
    color: var(--accent-gold);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .kc-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.4);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .uniques-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.4);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 0.8rem;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .item-info {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .item-pts {
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-color);
    border-radius: 4px;
    background: var(--bg-color);
    cursor: pointer;
    position: relative;
    transition: background 0.2s, border-color 0.2s;
  }

  input[type="checkbox"]:checked {
    background: var(--accent-green);
    border-color: var(--accent-green);
  }

  input[type="checkbox"]:checked::after {
    content: '✔';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 11px;
    font-weight: bold;
  }

  .completed-card {
    border-color: rgba(34, 197, 94, 0.4);
    background: linear-gradient(135deg, var(--card-bg) 0%, rgba(34, 197, 94, 0.05) 100%);
  }

  .tile-clear-banner {
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid var(--accent-green);
    color: #4ade80;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px;
    border-radius: 6px;
    display: none;
  }

  .card-complete .tile-clear-banner {
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>🎄 12 Bosses of Christmas 🎄</h1>
  <div class="subtitle">Solo Bingo Board (50 KC / 12 Jad & 2 Zuk)</div>
  
  <div class="team-bar">
    <label for="team-input"><strong>RSN / Participant:</strong></label>
    <input type="text" id="team-input" value="KingMothyTM" onchange="switchParticipant()">
    <button onclick="switchParticipant()">Load Board</button>
    <span id="sync-status" class="status-pill">Connecting...</span>
  </div>

  <div class="scoreboard">
    Active RSN: <span id="current-team-display" style="color:#22c55e;">KingMothyTM</span> &nbsp;|&nbsp; Total Score: <span id="total-score">0</span> pts
  </div>
</header>

<div class="leaderboard-box" id="leaderboard-box" style="display:none;">
  <div class="leaderboard-title">🏆 Live Clan Standings (Click a name to view their board)</div>
  <div class="leaderboard-list" id="leaderboard-list"></div>
</div>

<div class="board-grid" id="bingo-board"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDu50hE1fkr1_srk1JBjtzXNv9HebjDwe4",
    authDomain: "bosses-of-christmas.firebaseapp.com",
    databaseURL: "https://bosses-of-christmas-default-rtdb.firebaseio.com",
    projectId: "bosses-of-christmas",
    storageBucket: "bosses-of-christmas.firebasestorage.app",
    messagingSenderId: "1003215290331",
    appId: "1:1003215290331:web:ef9d50d0aba1ecf49ab1fe"
  };

  const TILE_CLEAR_BONUS_PTS = 10;

  const bossData = [
    {
      name: "Giant Mole",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Baby mole (Pet)", pts: 4 }
      ]
    },
    {
      name: "King Black Dragon",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Draconic visage", pts: 3 },
        { name: "Dragon Pickaxe", pts: 3 },
        { name: "KBD Heads", pts: 3 },
        { name: "Prince black dragon (Pet)", pts: 4 }
      ]
    },
    {
      name: "Sarachnis",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Sarachnis cudgel", pts: 3 },
        { name: "Jar of Eyes", pts: 3 },
        { name: "Sraracha (Pet)", pts: 4 }
      ]
    },
    {
      name: "TzTok-Jad / TzKal-Zuk",
      kcTarget: "12 Jad / 2 Zuk",
      kcPts: 2,
      items: [
        { name: "Fire / Infernal cape", pts: 3 },
        { name: "Jad / Zuk (Pet)", pts: 4 }
      ]
    },
    {
      name: "Kalphite Queen",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Dragon chain", pts: 3 },
        { name: "Dragon 2h", pts: 3 },
        { name: "Kq Head", pts: 3 },
        { name: "Jar of Sand", pts: 3 },
        { name: "Kalphite princess (Pet)", pts: 4 }
      ]
    },
    {
      name: "Zulrah",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Magic Fang", pts: 3 },
        { name: "Tanzanite Fang", pts: 3 },
        { name: "Serpentine Visage", pts: 3 },
        { name: "Onyx", pts: 3 },
        { name: "Tanzanite Mutagen", pts: 3 },
        { name: "Magma Mutagen", pts: 3 },
        { name: "Pet snakeling (Pet)", pts: 4 }
      ]
    },
    {
      name: "Vorkath",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Vorkath's Head", pts: 3 },
        { name: "Skeletal Visage", pts: 3 },
        { name: "Jar of Decay", pts: 3 },
        { name: "Dragonbone Necklace", pts: 3 },
        { name: "Vorki (Pet)", pts: 4 }
      ]
    },
    {
      name: "The Gauntlet (Or Corrupted)",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Enhanced Crystal Weapon Seed", pts: 3 },
        { name: "Crystal Weapon Seed", pts: 3 },
        { name: "Crystal Armour Seed", pts: 3 },
        { name: "Youngllef (Pet)", pts: 4 }
      ]
    },
    {
      name: "General Graardor",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Bandos Chestplate", pts: 3 },
        { name: "Bandos Tassets", pts: 3 },
        { name: "Bandos Boots", pts: 3 },
        { name: "Bandos Hilt", pts: 3 },
        { name: "Pet general graardor", pts: 4 }
      ]
    },
    {
      name: "The Hueycoatl",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Hueycoatl Hide", pts: 3 },
        { name: "Dragon Hunter Wand", pts: 3 },
        { name: "Tome of Earth", pts: 3 },
        { name: "Huberte (Pet)", pts: 4 }
      ]
    },
    {
      name: "Phantom Muspah",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Venator shard", pts: 3 },
        { name: "Ancient Icon", pts: 3 },
        { name: "Muphin (Pet)", pts: 4 }
      ]
    },
    {
      name: "Corporeal Beast",
      kcTarget: 50,
      kcPts: 2,
      items: [
        { name: "Elysian ", pts: 3 },
        { name: "Spectral ", pts: 3 },
        { name: "Arcane Sigil", pts: 3 },
        { name: "Spirit shield", pts: 3 },
        { name: "Holy Elixer", pts: 3 },
        { name: "Jar of Spirits", pts: 3 },
        { name: "Pet dark core (Pet)", pts: 4 }
      ]
    }
  ];

  let db = null;
  let allParticipantsData = {};

  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    const statusEl = document.getElementById("sync-status");
    statusEl.innerText = "🟢 Live Cloud Sync Active";
    statusEl.classList.add("live");

    const participantsRef = ref(db, "christmas_bingo_2026/participants");
    onValue(participantsRef, (snapshot) => {
      allParticipantsData = snapshot.val() || {};
      renderLeaderboard();
      applyCurrentParticipantState();
    });
  } catch (err) {
    console.error("Firebase init failed:", err);
    const statusEl = document.getElementById("sync-status");
    statusEl.innerText = "⚠️ Sync Error (Check DB Rules)";
  }

  function sanitizeKey(name) {
    return (name.trim() || "DefaultParticipant").toLowerCase().replace(/[.#$\[\]/\s]+/g, "_");
  }

  function getDisplayName() {
    return document.getElementById("team-input").value.trim() || "DefaultParticipant";
  }

  function renderLeaderboard() {
    const box = document.getElementById("leaderboard-box");
    const list = document.getElementById("leaderboard-list");
    const entries = Object.values(allParticipantsData);
    if (entries.length === 0) {
      box.style.display = "none";
      return;
    }
    box.style.display = "block";
    entries.sort((a, b) => (b.score || 0) - (a.score || 0));
    list.innerHTML = "";
    entries.forEach((entry, idx) => {
      const chip = document.createElement("div");
      chip.className = "lb-chip";
      const medal = idx === 0 ? "🥇 " : idx === 1 ? "🥈 " : idx === 2 ? "🥉 " : "";
      chip.innerHTML = `${medal}${entry.displayName}<strong>${entry.score || 0} pts</strong>`;
      chip.onclick = () => {
        document.getElementById("team-input").value = entry.displayName;
        window.switchParticipant();
      };
      list.appendChild(chip);
    });
  }

  function renderBoard() {
    const board = document.getElementById("bingo-board");
    board.innerHTML = "";

    bossData.forEach((boss, bossIndex) => {
      const card = document.createElement("div");
      card.className = "boss-card";
      card.id = `card-${bossIndex}`;

      let html = `
        <div class="boss-header">
          <span class="boss-title">${boss.name}</span>
          <span class="boss-points-badge" id="badge-${bossIndex}">0 pts</span>
        </div>
        <div class="tile-clear-banner" id="banner-${bossIndex}">✨ Tile Fully Cleared (+${TILE_CLEAR_BONUS_PTS} Bonus Pts)! ✨</div>
        <div>
          <div class="section-label">Kill Count Target</div>
          <div class="kc-section">
            <span class="kc-info">Target: <strong>${boss.kcTarget}</strong> (+${boss.kcPts} pts)</span>
            <input type="checkbox" id="kc-${bossIndex}">
          </div>
        </div>
        <div>
          <div class="section-label">Uniques & Pets</div>
          <div class="uniques-list">
      `;

      boss.items.forEach((item, itemIndex) => {
        html += `
          <div class="item-row">
            <div class="item-info">
              <span>${item.name}</span>
              <span class="item-pts">(+${item.pts} pts)</span>
            </div>
            <input type="checkbox" id="item-${bossIndex}-${itemIndex}">
          </div>
        `;
      });

      html += `</div></div>`;
      card.innerHTML = html;
      board.appendChild(card);

      document.getElementById(`kc-${bossIndex}`).addEventListener("change", saveAndScore);
      boss.items.forEach((_, itemIndex) => {
        document.getElementById(`item-${bossIndex}-${itemIndex}`).addEventListener("change", saveAndScore);
      });
    });

    applyCurrentParticipantState();
  }

  function saveAndScore() {
    const state = {};
    bossData.forEach((boss, bossIndex) => {
      state[`kc-${bossIndex}`] = document.getElementById(`kc-${bossIndex}`).checked;
      boss.items.forEach((item, itemIndex) => {
        state[`item-${bossIndex}-${itemIndex}`] = document.getElementById(`item-${bossIndex}-${itemIndex}`).checked;
      });
    });

    const totalScore = calculateScore();
    const key = sanitizeKey(getDisplayName());
    const displayName = getDisplayName();

    if (db) {
      set(ref(db, `christmas_bingo_2026/participants/${key}`), {
        displayName: displayName,
        score: totalScore,
        checks: state,
        updatedAt: Date.now()
      }).catch((err) => {
        console.error("Firebase write failed:", err);
        const statusEl = document.getElementById("sync-status");
        statusEl.innerText = "⚠️ Save Blocked (Check DB Rules)";
        statusEl.classList.remove("live");
      });
    } else {
      localStorage.setItem(`osrs_bingo_solo_v2_${key}`, JSON.stringify(state));
    }
  }

  function applyCurrentParticipantState() {
    const displayName = getDisplayName();
    const key = sanitizeKey(displayName);
    document.getElementById("current-team-display").innerText = displayName;

    let state = null;
    if (db && allParticipantsData[key]) {
      state = allParticipantsData[key].checks || {};
    } else if (!db) {
      const saved = localStorage.getItem(`osrs_bingo_solo_v2_${key}`);
      if (saved) state = JSON.parse(saved);
    }

    bossData.forEach((boss, bossIndex) => {
      document.getElementById(`kc-${bossIndex}`).checked = !!(state && state[`kc-${bossIndex}`]);
      boss.items.forEach((item, itemIndex) => {
        document.getElementById(`item-${bossIndex}-${itemIndex}`).checked = !!(state && state[`item-${bossIndex}-${itemIndex}`]);
      });
    });

    calculateScore();
  }

  function calculateScore() {
    let totalScore = 0;

    bossData.forEach((boss, bossIndex) => {
      let cardScore = 0;
      const totalCheckboxesOnTile = 1 + boss.items.length;
      let checkedCount = 0;

      const kcChecked = document.getElementById(`kc-${bossIndex}`).checked;
      if (kcChecked) {
        cardScore += boss.kcPts;
        checkedCount++;
      }

      boss.items.forEach((item, itemIndex) => {
        if (document.getElementById(`item-${bossIndex}-${itemIndex}`).checked) {
          cardScore += item.pts;
          checkedCount++;
        }
      });

      const card = document.getElementById(`card-${bossIndex}`);

      if (checkedCount === totalCheckboxesOnTile) {
        cardScore += TILE_CLEAR_BONUS_PTS;
        card.classList.add("card-complete");
      } else {
        card.classList.remove("card-complete");
      }

      totalScore += cardScore;
      document.getElementById(`badge-${bossIndex}`).innerText = `${cardScore} pts`;

      if (checkedCount > 0) {
        card.classList.add("completed-card");
      } else {
        card.classList.remove("completed-card");
      }
    });

    document.getElementById("total-score").innerText = totalScore;
    return totalScore;
  }

  window.switchParticipant = function() {
    applyCurrentParticipantState();
  };

  renderBoard();
</script>

</body>
</html>
